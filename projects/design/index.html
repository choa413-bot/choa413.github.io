<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />

    <title>Photo Collage</title>

    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <main class="collage" aria-label="Photo scrapbook collage">
    
      <img
        class="collage-image food"
        src="images/food.jpg"
        alt="Food spread"
      />

      <img
        class="collage-image teeth"
        src="images/teeth.jpeg"
        alt="Close-up of teeth"
      />

      <img
        class="collage-image star"
        src="images/star.svg"
        alt=""
        aria-hidden="true"
      />

      <img
        class="collage-image dogbeer"
        src="images/dogbeer.jpg"
        alt="Sleepy dog with a beer"
      />

      <img
        class="collage-image graffiti"
        src="images/graffiti.jpg"
        alt="Graffiti artwork"
      />

      <img
        class="collage-image mirror"
        src="images/mirror-selfie.jpg"
        alt="Mirror selfie"
      />

      <img
        class="collage-image cig"
        src="images/cig.svg"
        alt="Cigarette package"
      />

      <img
        class="collage-image deer"
        src="images/deer.png"
        alt="Deer"
      />

      <img
        class="collage-image heart"
        src="images/pixel-heart.svg"
        alt=""
        aria-hidden="true"
      />

      <img
        class="plastic-texture"
        src="images/plastic-texture.png"
        alt=""
        aria-hidden="true"
      />
    </main>
  </body>
</html>
