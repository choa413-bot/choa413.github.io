<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Photo Collage</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <main class="collage">
      <img
        class="collage-image food"
        src="images/food.jpg"
        alt="Food spread"
      />

      <img
        class="collage-image teeth"
        src="images/teeth.jpeg"
        alt="Close-up of teeth"
      />

      <img
        class="collage-image star"
        src="images/star.jpg"
        alt="Colorful star"
      />

      <img
        class="collage-image dogbeer"
        src="images/dogbeer.jpg"
        alt="sleepy dog with beer"
      />

      <img
        class="collage-image graffiti"
        src="images/graffiti.jpg"
        alt="graffiti"
      />

      <img
        class="collage-image mirror"
        src="images/mirror-selfie.jpg"
        alt="Mirror selfie"
      />

      <img
        class="collage-image cig"
        src="images/cig.jpg"
        alt="cig package"
      />

      <img
        class="collage-image deer"
        src="images/deer.png"
        alt="deer"
      />

      <img
        class="collage-image heart"
        src="images/pixel-heart.png"
        alt="Pixel heart"
      />

      <img
        class="plastic-texture"
        src="images/plastic-texture.png"
        alt=""
        aria-hidden="true"
      />
    </main>
  </body>
</html>
